return(Q.length?`<div class="sec">⚡ ક્વિક સેલ</div><div class="rail">${Q.map(card).join('')}</div>`:'')+`<div class="sec">બધી વસ્તુઓ</div>`+(A.length?`<div class="grid">${A.map(card).join('')}</div>`:'<p class="mu">કોઈ વસ્તુ મળી નથી.</p>')}
const adsHtml=()=>ADS.length?`<div class="ads" id="ads">${ADS.map(a=>`${a.link?`<a href="${E(a.link)}" target="_blank" rel="noopener sponsored">`:'<a>'}<img src="${su(a.img)}" alt=""></a>`).join('')}</div>`:'';
const autoAds=()=>{const e=$('ads');if(e&&ADS.length>1)adT=setInterval(()=>{const n=Math.round(e.scrollLeft/e.clientWidth)+1;e.scrollTo({left:n>=ADS.length?0:n*e.clientWidth,behavior:'smooth'})},4000)};
const home=()=>`${adsHtml()}<input style="margin-top:12px" placeholder="શોધો..." value="${E(q)}" oninput="q=this.value.trim().toLowerCase();$('ls').innerHTML=mkList()"><div class="chips">${['બધી',...CATS].map((c,i)=>`<span class="chip ${(i?CATS[i-1]:'')==cat?'on':''}" onclick="setCat(${i?`CATS[${i-1}]`:"''"})">${E(c)}</span>`).join('')}</div><div id="ls">${okL?mkList():'<p class="mu">લોડ થઈ રહ્યું છે...</p>'}</div>`;
function item(){const id=R().slice(5);if(!okId(id))return'<div class="card">આ વસ્તુ ઉપલબ્ધ નથી.</div>';const x=L.concat(MY,X).find(z=>z.id==id);
if(!x){if(!fx){fx=1;db.collection('listings').doc(id).get().then(d=>X.push(d.exists?{...d.data(),id}:{id,gone:1})).catch(()=>X.push({id,gone:1})).then(()=>{fx=0;render()})}return'<p class="mu">લોડ થઈ રહ્યું છે...</p>'}
if(x.gone)return'<div class="card">આ વસ્તુ હવે ઉપલબ્ધ નથી. <button class="b s" onclick="go(\'home\')">🏠 હોમ</button></div>';
const ph=x.phone||(CT[id]&&CT[id].phone)||'';if(U&&!ph&&!CT[id]&&!cfx){cfx=1;db.collection('contacts').doc(id).get().then(d=>{CT[id]=d.exists?d.data():{phone:''}}).catch(()=>{CT[id]={phone:''}}).then(()=>{cfx=0;render()})}const w=ph.replace(/\D/g,'');
return`<div class="card"><div class="gal" onscroll="dots(this)" onclick="lbOpen(Math.round(this.scrollLeft/this.clientWidth))">${x.imgs.map(i=>`<img src="${su(i)}" alt="">`).join('')}</div>${x.imgs.length>1?`<div class="dots">${x.imgs.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:''}<h2>${E(x.title)}</h2><h2 style="color:var(--ac)">₹${E(x.price)}</h2><p class="mu">${E(x.cat)} · 📍 ${E(x.area||'')}${x.city?', '+E(x.city):''}</p><p style="white-space:pre-wrap">${E(x.desc)}</p><p class="mu">વેચનાર: ${E(x.name)}</p>${U?(ph?`<a class="b" href="tel:${E(ph)}">📞 ફોન કરો</a> <a class="b" style="background:#25d366" target="_blank" rel="noopener" href="https://wa.me/${w}?text=${encodeURIComponent('Online Kalavad: '+x.title)}">WhatsApp</a>`:(CT[id]?'<p class="mu">સંપર્ક ઉપલબ્ધ નથી</p>':'<p class="mu">લોડ થઈ રહ્યું છે...</p>')):`<button class="b" onclick="needLogin()">📞 ફોન કરો</button> <button class="b" style="background:#25d366" onclick="needLogin()">WhatsApp</button><p class="mu">ફોન / WhatsApp માટે મોબાઇલ OTP થી લૉગિન જરૂરી છે.</p>`}</div>`}
const sell=()=>`<div class="card"><h2>જાહેરાત આપો</h2><div class="f"><select id="sc"><option value="">— વસ્તુની કેટેગરી —</option>${CATS.map(c=>`<option>${E(c)}</option>`).join('')}</select><select id="sci">${CITY.map(c=>`<option>${E(c)}</option>`).join('')}</select><select id="sar"><option value="">— એરિયા / ગામ —</option>${AREAS.map(c=>`<option>${E(c)}</option>`).join('')}</select><input id="stt" maxlength="80" placeholder="વસ્તુનું નામ"><div class="mu">ફોટા (વધુમાં વધુ 5)</div><div id="pv" class="pv"></div><label class="b s g">📷 ફોટો ઉમેરો<input type="file" accept="image/*" multiple hidden onchange="addPh(this)"></label><textarea id="sd" rows="4" maxlength="1000" placeholder="વસ્તુની વિગત"></textarea><input id="sp" type="number" min="0" placeholder="કિંમત (₹)"><button class="b" id="sbtn" onclick="sub()">સબમિટ કરો</button><div class="mu">સબમિટ પછી એડમિન ચકાસીને મંજૂર કરશે.</div></div></div>`;
function addPh(el){for(const f of el.files){if(ph.length>=5){mAlert('વધુમાં વધુ 5 ફોટા');break}ph.push(f)}el.value='';rpv()}
const rpv=()=>$('pv').innerHTML=ph.map((f,i)=>`<div class="th" style="background-image:url(${URL.createObjectURL(f)})"><i onclick="ph.splice(${i},1);rpv()">✕</i></div>`).join('');
const cmp=(f,m)=>new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const i=new Image();i.onerror=no;i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.max(1,i.width*s|0);c.height=Math.max(1,i.height*s|0);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.72)};i.src=r.result};r.readAsDataURL(f)});
async function sub(){const g=i=>$(i).value.trim(),d={cat:g('sc'),city:g('sci'),area:g('sar'),title:g('stt'),desc:g('sd'),price:g('sp')};
if(!d.cat||!d.area||!d.title||!d.desc||d.price===''||+d.price<0||!ph.length){mAlert('બધી વિગત ભરો અને ઓછામાં ઓછો 1 ફોટો મૂકો');return}
const b=$('sbtn');b.disabled=true;b.textContent='અપલોડ થઈ રહ્યું છે...';try{const id=db.collection('listings').doc().id,up=async(f,m,n)=>{const r=st.ref(`market/${U.uid}/${id}_${n}.jpg`);await r.put(await cmp(f,m),{contentType:'image/jpeg'});return r.getDownloadURL()};
const imgs=await Promise.all(ph.map((f,i)=>up(f,900,i))),thumb=await up(ph[0],360,'t');
const bt=db.batch();bt.set(db.collection('listings').doc(id),{...d,price:+d.price,uid:U.uid,name:me.name||'',imgs,thumb,status:'pending',quick:false,reason:'',ts:Date.now()});bt.set(db.collection('contacts').doc(id),{uid:U.uid,phone:U.phoneNumber,name:me.name||''});await bt.commit();okM=0;mAlert('સબમિટ થઈ ગયું ✅ એડમિનની મંજૂરીની રાહ જુઓ');go('me')}catch(e){mAlert('Upload fail: '+(e.code||'')+' '+e.message);b.disabled=false;b.textContent='સબમિટ કરો'}}
let myUn=null;
function loadMy(){okM=1;if(myUn)myUn();myUn=db.collection('listings').where('uid','==',U.uid).onSnapshot(s=>{MY=s.docs.map(d=>({...d.data(),id:d.id})).filter(x=>okId(x.id)).sort((a,b)=>b.ts-a.ts);if(R()=='me')render()},e=>mAlert(e.message))}
const SL={pending:'⏳ પેન્ડિંગ – એડમિનની મંજૂરીની રાહ',approved:'✅ મંજૂર – લાઇવ',rejected:'❌ રિજેક્ટ',sold:'✔ વેચાઈ ગઈ',withdrawn:'✖ વેચવી નથી'};
const mine=()=>`<div class="sec">👤 ${E(me.name)} <span class="mu">${E(U.phoneNumber)}</span></div>`+(okM?(MY.length?MY.map(x=>`<div class="card"><div style="display:flex;gap:10px;cursor:pointer" onclick="go('item-${x.id}')"><div class="th" style="width:70px;height:70px;flex:none;background-image:url('${su(x.thumb)}')"></div><div><b>${E(x.title)}</b><div>₹${E(x.price)}</div><span class="bd">${SL[x.status]||''}</span></div></div>${x.status=='rejected'?`<p class="mu">કારણ: ${E(x.reason)}</p>`:''}<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${x.status=='approved'?`<button class="b s" onclick="close_('${x.id}','sold')">✔ વેચાઈ ગઈ</button><button class="b s g" onclick="close_('${x.id}','withdrawn')">✖ વેચવી નથી</button>`:`<button class="b s g" onclick="del('${x.id}')">🗑 Delete</button>`}</div></div>`).join(''):'<p class="mu">હજી કોઈ વસ્તુ નથી.</p>'):'<p class="mu">લોડ થઈ રહ્યું છે...</p>');
async function close_(id,s){if(!await mConfirm('આ વસ્તુ લિસ્ટમાંથી હટાવવી છે?'))return;try{await db.collection('listings').doc(id).update({status:s});L=L.filter(x=>x.id!=id);okM=0;render()}catch(e){mAlert(e.message)}}
async function del(id){if(!await mConfirm('Delete કરવી છે?'))return;const x=MY.find(z=>z.id==id);try{await db.collection('listings').doc(id).delete();db.collection('contacts').doc(id).delete().catch(()=>{});[...x.imgs,x.thumb].forEach(u=>rmf(u));okM=0;render()}catch(e){mAlert(e.message)}}
function dots(g){const i=Math.round(g.scrollLeft/g.clientWidth);document.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('on',k==i))}
const page=()=>{const p=PG[+R().slice(5)];return p?`<div class="card"><h2>${E(p.t)}</h2><p style="white-space:pre-wrap">${E(p.c)}</p></div>`:'<p class="mu">પાનું મળ્યું નથી</p>'};
function mShow(msg,btns){return new Promise(res=>{const d=document.createElement('div');d.className='md';d.innerHTML=`<div class="mc"><img src="icon-192.png" alt=""><h3 style="margin:8px 0 0;color:var(--ac)">Online Kalavad</h3><p>${E(msg)}</p><div class="mbt">${btns.map((b,i)=>`<button class="b ${b[1]?'':'g'}" data-i="${i}">${b[0]}</button>`).join('')}</div></div>`;d.onclick=e=>{const i=e.target.dataset&&e.target.dataset.i;if(i!==undefined){d.remove();res(btns[i][2])}};document.body.appendChild(d)})}
const mAlert=m=>mShow(String(m),[['ઠીક છે',1,true]]),mConfirm=m=>mShow(String(m),[['રદ કરો',0,false],['હા',1,true]]);
let dp=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
addEventListener('appinstalled',()=>{dp=null;$('ib').style.display='none'});
async function inst(){if(dp){dp.prompt();await dp.userChoice;dp=null;return}
mAlert(/iphone|ipad|ipod/i.test(navigator.userAgent)?'iPhone માં: નીચે Share બટન દબાવો → "Add to Home Screen" પસંદ કરો.':'બ્રાઉઝરના મેનુ (⋮) માં જઈને "Install app" અથવા "Add to Home screen" દબાવો.')}
if(!(matchMedia('(display-mode: standalone)').matches||navigator.standalone))$('ib').style.display='block';
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
let LBI=[],LBK=0,LB={s:1,x:0,y:0};
const lbT=()=>{const i=$('lbi');if(i)i.style.transform=`translate(${LB.x}px,${LB.y}px) scale(${LB.s})`};
function lbShow(){LB={s:1,x:0,y:0};$('lbi').src=su(LBI[LBK]);lbT();$('lbc').textContent=(LBK+1)+' / '+LBI.length}
function lbClose(){history.state&&history.state.lb?history.back():$('lb')&&$('lb').remove()}
addEventListener('popstate',()=>{const e=$('lb');if(e)e.remove()});
function lbOpen(k){const x=L.concat(MY,X).find(z=>z.id==R().slice(5));if(!x||$('lb'))return;LBI=x.imgs;LBK=Math.max(0,Math.min(k||0,LBI.length-1));
const d=document.createElement('div');d.id='lb';d.style.cssText='position:fixed;inset:0;background:#000;z-index:80;touch-action:none;overflow:hidden;-webkit-user-select:none;user-select:none';
d.innerHTML='<img id="lbi" draggable="false" alt="" style="position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;transform-origin:center;pointer-events:none"><div id="lbc" style="position:absolute;top:18px;left:16px;color:#fff;font:15px system-ui"></div><div onclick="lbClose()" style="position:absolute;top:8px;right:12px;color:#fff;font-size:28px;padding:4px 14px;cursor:pointer;background:rgba(255,255,255,.18);border-radius:22px">✕</div>';
document.body.appendChild(d);history.pushState({lb:1},'',location.href);lbShow();
const P=new Map();let d0=1,s0=1,t0=0,lx=0;
d.addEventListener('pointerdown',e=>{if(e.target!==d)return;d.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
if(P.size==2){const[a,b]=[...P.values()];d0=Math.hypot(a[0]-b[0],a[1]-b[1])||1;s0=LB.s}else{lx=e.clientX;const n=Date.now();if(n-t0<300){LB.s=LB.s>1?1:2.5;LB.x=LB.y=0;lbT()}t0=n}});
d.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);if(!p)return;P.set(e.pointerId,[e.clientX,e.clientY]);
if(P.size==2){const[a,b]=[...P.values()];LB.s=Math.min(5,Math.max(1,s0*Math.hypot(a[0]-b[0],a[1]-b[1])/d0));lbT()}
else if(LB.s>1){LB.x+=e.clientX-p[0];LB.y+=e.clientY-p[1];lbT()}});
const up=e=>{if(!P.has(e.pointerId))return;const was=P.size;P.delete(e.pointerId);
if(was==1&&LB.s==1){const dx=e.clientX-lx;if(Math.abs(dx)>60&&LBI.length>1){LBK=(LBK+(dx<0?1:-1)+LBI.length)%LBI.length;lbShow()}}
if(LB.s<1.02){LB={s:1,x:0,y:0};lbT()}};
d.addEventListener('pointerup',up);d.addEventListener('pointercancel',up)}
let CT={},cfx=0;
const needLogin=()=>{ret=R();go('login')};
</script></body></html>
