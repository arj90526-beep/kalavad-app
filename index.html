<style>

@media(prefers-color-scheme:dark){:root{--bg:#121212;--card:#1e1e1e;--tx:#eee;--mu:#9a9a9a;--ac:#ff6b4a;--bd:#333}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;line-height:1.5}

.bar input{flex:1;min-width:0;padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}

.rc{flex:0 0 118px;aspect-ratio:9/14;border-radius:10px;background:linear-gradient(160deg,var(--ac),#222) center/cover;position:relative;cursor:pointer;overflow:hidden}

.art h1{font-size:23px;line-height:1.35;margin:0 0 4px}.art p{font-size:17px;white-space:pre-wrap}

<header><div class="w"><div class="bar"><div class="logo" id="logo" onclick="location.hash='home'"></div>
<input id="q" placeholder="Search..." oninput="qs=this.value.trim().toLowerCase();if(location.hash&&location.hash!='#home')location.hash='home';else render()"></div></div></header>
<main class="w" id="app"><p class="mu">લોડ થઈ રહ્યું છે...</p></main>
<footer>© Online Kalavad · www.onlinekalavad.com</footer>
<script>
firebase.initializeApp(CFG);var db=firebase.firestore();
var HOME_TITLE=document.title;var A=[],ADS={},SITE={name:"Online Kalavad",logo:""},qs="",ready=false;
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
Promise.all([db.collection("news").orderBy("ts","desc").limit(60).get(),db.collection("newsAds").get(),db.collection("newsSite").doc("main").get()]).then(function(r){
A=r[0].docs.map(function(d){var o=d.data();o.id=d.id;return o});r[1].docs.forEach(function(d){ADS[d.id]=d.data()});if(r[2].exists)SITE=Object.assign(SITE,r[2].data());ready=true;render()
}).catch(function(e){document.getElementById("app").innerHTML='<p class="mu">ડેટા લોડ થયો નહીં: '+esc(e.message)+'</p>'});
function ad(k){var a=ADS[k];if(!a||!a.img)return"";return'<a class="ad" '+(a.link?'href="'+esc(a.link)+'" target="_blank" rel="noopener sponsored"':'')+'><small>જાહેરાત</small><img src="'+a.img+'" alt=""></a>'}
function bg(a){return a.img?' style="background-image:url('+a.img+')"':''}
function render(){var l=document.getElementById("logo");l.innerHTML='<img src="'+(SITE.logo||'icon-192.png')+'" alt="Online Kalavad logo">'+'<span>'+esc(SITE.name)+'</span>';
if(!ready)return;var h=location.hash.slice(1)||"home",app=document.getElementById("app");
if(h.indexOf("post-")==0)return post(h.slice(5));document.title=HOME_TITLE;app.innerHTML=home();window.scrollTo(0,0)}
function item(a){return'<div class="item" onclick="location.hash=\'post-'+a.id+'\'"><h3>'+esc(a.title)+'<div class="mu" style="margin-top:6px">'+esc(a.d)+'</div></h3><div class="t"'+bg(a)+'></div></div>'}
function home(){var L=A.filter(function(a){return!qs||a.title.toLowerCase().indexOf(qs)>-1});var T=qs?[]:A.filter(function(a){return a.tr});
return ad("top")+(T.length?'<div class="sec">🔥 ટ્રેન્ડિંગ</div><div class="reel">'+T.map(function(a){return'<div class="rc"'+bg(a)+' onclick="location.hash=\'post-'+a.id+'\'"><span>'+esc(a.title)+'</span></div>'}).join("")+'</div>':'')+
'<div class="sec">તાજા સમાચાર</div>'+(L.length?L.map(function(a,i){return item(a)+(i==1?ad("mid"):"")}).join(""):'<p class="mu">કોઈ સમાચાર મળ્યા નથી.</p>')}
function vid(u){var m=u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);if(m)return'<iframe src="https://www.youtube.com/embed/'+m[1]+'" allowfullscreen></iframe>';
if(/\.(mp4|webm)(\?|$)/i.test(u))return'<video src="'+esc(u)+'" controls playsinline></video>';return'<p><a href="'+esc(u)+'" target="_blank" rel="noopener">▶ વીડિયો જુઓ</a></p>'}
function post(id){var a=A.find(function(x){return x.id==id}),app=document.getElementById("app");app.innerHTML='<p class="mu">લોડ થઈ રહ્યું છે...</p>';
db.collection("newsBody").doc(id).get().then(function(d){if(!d.exists){app.innerHTML='<p class="mu">સમાચાર મળ્યા નથી.</p>';return}
var t=a?a.title:"",dt=a?a.d:"";document.title=t+" – "+SITE.name;
app.innerHTML=ad("top")+'<article class="art"><h1>'+esc(t)+'</h1><div class="mu">'+esc(dt)+'</div>'+(d.data().blocks||[]).map(function(b){return b.t=="p"?'<p>'+esc(b.v)+'</p>':b.t=="img"?'<img src="'+b.v+'" alt="">':vid(b.v)}).join("")+
'<div class="sh"><b>📤 શેર કરો:</b> <button class="b" style="background:#25d366" onclick="share(\'wa\')">WhatsApp</button> <button class="b" style="background:#c13584" onclick="share(\'ig\')">Instagram</button> <button class="b" style="background:#1877f2" onclick="share(\'fb\')">Facebook</button> <button class="b g" onclick="share(\'cp\')">🔗 લિંક કોપી</button></div><button class="b g" onclick="location.hash=\'home\'">← પાછા</button></article>'+ad("mid");window.scrollTo(0,0)})}
function cp(u){try{navigator.clipboard.writeText(u).then(function(){alert("લિંક કોપી થઈ ગઈ ✅")},function(){prompt("લિંક કોપી કરો:",u)})}catch(e){prompt("લિંક કોપી કરો:",u)}}
function share(w){var u=location.href,t=document.title;
if(w=="wa")window.open("https://wa.me/?text="+encodeURIComponent(t+"\n"+u),"_blank");
else if(w=="fb")window.open("https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(u),"_blank");
else if(w=="ig"){if(navigator.share)navigator.share({title:t,url:u}).catch(function(){});else cp(u)}else cp(u)}
window.addEventListener("hashchange",render);render();
</script></body></html>
