let U=null,tab='pending',D=[],ok=0,C=[],LOC={city:['કાલાવડ'],area:DAREA.slice()},AD=[{},{},{},{},{}];
const $=s=>document.getElementById(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
au.onAuthStateChanged(u=>{if(u&&u.email!==ADMIN_EMAIL){au.signOut();alert('આ એડમિન એકાઉન્ટ નથી');return}U=u;ok=0;render()});
const TB=[['pending','⏳ Pending'],['approved','✅ Approved'],['rejected','❌ Rejected'],['quick','⚡ Quick Sell'],['cats','🗂 Categories'],['loc','📍 City/Area'],['ads','📢 Banners'],['pages','📄 Pages']];
function render(){const a=$('app');if(!U){a.innerHTML='<div class="card" style="max-width:340px;margin:40px auto"><h2>🔐 Market Admin</h2><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="b" onclick="login()">Login</button></div>';return}
if(!ok){load();a.innerHTML='<p class="mu">Loading...</p>';return}
const t=`<div>${TB.map(x=>`<button class="b${tab==x[0]?'':' g'}" onclick="sw('${x[0]}')">${x[1]}</button>`).join('')}<button class="b g" onclick="au.signOut()">Logout</button></div>`;
if(tab=='loc'){const lt=(k,n)=>`<div class="card"><h3>${n}</h3>${LOC[k].map((c,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)"><span>${E(c)}</span><span><button class="b g" onclick="el('${k}',${i})">✏️</button><button class="b g" onclick="dl('${k}',${i})">🗑</button></span></div>`).join('')}<div style="display:flex;gap:6px;margin-top:10px"><input id="n_${k}" style="margin:0" placeholder="નવું નામ"><button class="b" onclick="al('${k}')">➕ Add</button></div></div>`;a.innerHTML=t+lt('city','🏙 City')+lt('area','📍 Area / ગામ');return}
if(tab=='pages'){a.innerHTML=t+pagesUI();return}
if(tab=='ads'){a.innerHTML=t+'<p class="mu">વધુમાં વધુ 5 banner. Home screen પર આપોઆપ સરકતા દેખાશે અને size આપોઆપ ગોઠવાશે.</p>'+AD.map((x,n)=>`<div class="card"><b>Banner ${n+1}</b>${x.img?`<div class="im"><img src="${E(x.img)}" style="height:auto;max-width:100%"></div>`:'<p class="mu">ખાલી</p>'}<input type="file" accept="image/*" onchange="upAd(${n},this)"><input placeholder="Link (https://...) – optional" value="${E(x.link||'')}" onchange="AD[${n}].link=this.value;svAd()">${x.img?`<button class="b g" onclick="rmAd(${n})">🗑 Banner હટાવો</button>`:''}</div>`).join('');return}
if(tab=='cats'){a.innerHTML=t+`<div class="card"><h3>વસ્તુની કેટેગરી</h3>${C.map((c,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)"><span>${E(c)}</span><span><button class="b g" onclick="ec(${i})">✏️ Edit</button><button class="b g" onclick="dc(${i})">🗑</button></span></div>`).join('')}<div style="display:flex;gap:6px;margin-top:10px"><input id="nc" style="margin:0" placeholder="નવી કેટેગરી"><button class="b" onclick="ac()">➕ Add</button></div><p class="mu">નોંધ: કેટેગરીનું નામ બદલવાથી જૂની વસ્તુઓની કેટેગરી બદલાતી નથી.</p></div>`;return}
a.innerHTML=t+`<p class="mu">${D.length} વસ્તુઓ</p>`+D.map(x=>`<div class="card"><b>${E(x.title)}</b> – ₹${E(x.price)}${x.quick?' ⚡':''}<div class="mu">${E(x.cat)} · 📍 ${E(x.area||'')}, ${E(x.city||'')}<br>વેચનાર: ${E(x.name)} ${E(x.phone)}</div><div class="im">${x.imgs.map(u=>`<a href="${E(u)}" target="_blank"><img src="${E(u)}"></a>`).join('')}</div><p style="white-space:pre-wrap">${E(x.desc)}</p>${tab=='rejected'?`<p class="mu">❌ કારણ: ${E(x.reason)}</p>`:''}${tab=='pending'||tab=='rejected'?`<button class="b" onclick="ap('${x.id}')">✅ મંજૂર</button><button class="b g" onclick="rj('${x.id}')">❌ રિજેક્ટ</button><button class="b g" onclick="bl('${x.uid}','${E(x.phone)}')">🚫 Block user</button>`:`<button class="b" onclick="qk('${x.id}',${!x.quick})">${x.quick?'⚡ Quick Sell માંથી હટાવો':'⚡ Quick Sell માં મૂકો'}</button>`}<button class="b g" onclick="rm('${x.id}')">🗑 Delete</button></div>`).join('')}
const sw=t=>{tab=t;ok=0;render()};
const login=()=>au.signInWithEmailAndPassword($('em').value.trim(),$('pw').value).catch(e=>alert(e.message));

quick'||x.quick).sort((a,b)=>b.ts-a.ts)}}catch(e){alert('Error: '+e.message)}ok=1;render()}
const svLoc=async()=>{try{await db.collection('meta').doc('loc').set(LOC);render()}catch(e){alert(e.message)}};
function al(k){const v=$('n_'+k).value.trim();if(v&&!LOC[k].includes(v)){LOC[k].push(v);svLoc()}}
function el(k,i){const v=prompt('નવું નામ:',LOC[k][i]);if(v&&v.trim()){LOC[k][i]=v.trim();svLoc()}}
function dl(k,i){if(confirm('"'+LOC[k][i]+'" હટાવવું છે?')){LOC[k].splice(i,1);svLoc()}}
const svAd=async()=>{try{await db.collection('meta').doc('ads').set({items:AD})}catch(e){alert(e.message)}};
const cmp=(f,m)=>new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const i=new Image();i.onerror=no;i.onload=()=>{const s=Math.min(1,m/i.width),c=document.createElement('canvas');c.width=Math.max(1,i.width*s|0);c.height=Math.max(1,i.height*s|0);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.8)};i.src=r.result};r.readAsDataURL(f)});
async function upAd(n,el){const f=el.files[0];if(!f)return;try{const r=st.ref('ads/'+n+'_'+Date.now()+'.jpg');await r.put(await cmp(f,1200),{contentType:'image/jpeg'});const old=AD[n].img;AD[n]={img:await r.getDownloadURL(),link:AD[n].link||''};await svAd();if(old)st.refFromURL(old).delete().catch(()=>{});render()}catch(e){alert('Upload fail: '+e.message)}}
async function rmAd(n){if(!confirm('Banner હટાવવો છે?'))return;const old=AD[n].img;AD[n]={};await svAd();if(old)st.refFromURL(old).delete().catch(()=>{});render()}
async function sc(){try{await db.collection('meta').doc('cats').set({list:C});render()}catch(e){alert(e.message)}}
function ac(){const v=$('nc').value.trim();if(v&&!C.includes(v)){C.push(v);sc()}}
function ec(i){const v=prompt('કેટેગરીનું નવું નામ:',C[i]);if(v&&v.trim()){C[i]=v.trim();sc()}}
function dc(i){if(confirm('"'+C[i]+'" કેટેગરી હટાવવી છે?')){C.splice(i,1);sc()}}
async function up(id,p){try{await db.collection('listings').doc(id).update(p);if(p.quick!==undefined){D.find(x=>x.id==id).quick=p.quick;if(tab=='quick'&&!p.quick)D=D.filter(x=>x.id!=id)}else D=D.filter(x=>x.id!=id);render()}catch(e){alert(e.message)}}
const ap=id=>up(id,{status:'approved',reason:''}),qk=(id,q)=>up(id,{quick:q});
function rj(id){const r=prompt('રિજેક્ટનું કારણ લખો:');if(r&&r.trim())up(id,{status:'rejected',reason:r.trim()})}
async function bl(uid,ph){if(!confirm('આ user ને block કરવો?'))return;try{await db.collection('blocked').doc(uid).set({phone:ph,ts:Date.now()});alert('Blocked ✅')}catch(e){alert(e.message)}}
async function rm(id){if(!confirm('Delete કરવી છે?'))return;const x=D.find(z=>z.id==id);try{await db.collection('listings').doc(id).delete();[...x.imgs,x.thumb].forEach(u=>st.refFromURL(u).delete().catch(()=>{}));D=D.filter(z=>z.id!=id);render()}catch(e){alert(e.message)}}
render();
let PGS=[],pe=-1;
const pagesUI=()=>PGS.map((p,i)=>`<div class="card"><b>${E(p.t)}</b><p class="mu" style="white-space:pre-wrap">${E(p.c).slice(0,120)}</p><button class="b g" onclick="pe=${i};render()">✏️ Edit</button><button class="b g" onclick="dpg(${i})">🗑</button></div>`).join('')+`<div class="card"><h3>${pe<0?'નવું પાનું (સાઇડ મેનુ)':'પાનું Edit'}</h3><input id="pt" placeholder="શીર્ષક (જેમ કે About)" value="${pe<0?'':E(PGS[pe].t)}"><textarea id="pc" rows="7" placeholder="અંદર શું લખવું છે...">${pe<0?'':E(PGS[pe].c)}</textarea><button class="b" onclick="spg()">💾 Save</button>${pe>=0?'<button class="b g" onclick="pe=-1;render()">Cancel</button>':''}</div>`;
const svPg=async()=>{try{await db.collection('meta').doc('pages').set({list:PGS});render()}catch(e){alert(e.message)}};
