<!DOCTYPE html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Market Admin – Online Kalavad</title>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-storage-compat.js"></script>
<script src="../config.js"></script>
<style>
:root{--bg:#f3f3f1;--card:#fff;--tx:#1a1a1a;--mu:#6b6b6b;--ac:#B3391C;--bd:#e3e3df}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--card:#1e1e1e;--tx:#eee;--mu:#9a9a9a;--ac:#ff6b4a;--bd:#333}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Gujarati",sans-serif;line-height:1.5}
.w{max-width:760px;margin:0 auto;padding:12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
input{width:100%;padding:10px;margin-bottom:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.b{cursor:pointer;border:0;border-radius:8px;padding:8px 12px;background:var(--ac);color:#fff;font:inherit;font-size:14px;margin:2px}.b.g{background:var(--mu)}.mu{color:var(--mu);font-size:13px}
.im{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.im img{height:110px;border-radius:8px}
</style></head><body><div class="w" id="app"></div>
<script>
firebase.initializeApp(CFG);const db=firebase.firestore(),au=firebase.auth(),st=firebase.storage();
const DEF=["મોબાઇલ","ઇલેક્ટ્રોનિક્સ","બાઇક / વાહન","ફર્નિચર","ઘરવખરી","ખેતીના સાધનો","કપડાં","પુસ્તકો","અન્ય"];
let U=null,tab='pending',D=[],ok=0,C=[];
const $=s=>document.getElementById(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
au.onAuthStateChanged(u=>{U=u;ok=0;render()});
const TB=[['pending','⏳ Pending'],['approved','✅ Approved'],['quick','⚡ Quick Sell'],['cats','🗂 Categories']];
function render(){const a=$('app');if(!U){a.innerHTML='<div class="card" style="max-width:340px;margin:40px auto"><h2>🔐 Market Admin</h2><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="b" onclick="login()">Login</button></div>';return}
if(!ok){load();a.innerHTML='<p class="mu">Loading...</p>';return}
const t=`<div>${TB.map(x=>`<button class="b${tab==x[0]?'':' g'}" onclick="sw('${x[0]}')">${x[1]}</button>`).join('')}<button class="b g" onclick="au.signOut()">Logout</button></div>`;
if(tab=='cats'){a.innerHTML=t+`<div class="card"><h3>વસ્તુની કેટેગરી</h3>${C.map((c,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)"><span>${E(c)}</span><span><button class="b g" onclick="ec(${i})">✏️ Edit</button><button class="b g" onclick="dc(${i})">🗑</button></span></div>`).join('')}<div style="display:flex;gap:6px;margin-top:10px"><input id="nc" style="margin:0" placeholder="નવી કેટેગરી"><button class="b" onclick="ac()">➕ Add</button></div><p class="mu">નોંધ: કેટેગરીનું નામ બદલવાથી જૂની વસ્તુઓની કેટેગરી બદલાતી નથી.</p></div>`;return}
a.innerHTML=t+`<p class="mu">${D.length} વસ્તુઓ</p>`+D.map(x=>`<div class="card"><b>${E(x.title)}</b> – ₹${E(x.price)}${x.quick?' ⚡':''}<div class="mu">${E(x.cat)}<br>વેચનાર: ${E(x.name)} ${E(x.phone)}</div><div class="im">${x.imgs.map(u=>`<a href="${E(u)}" target="_blank"><img src="${E(u)}"></a>`).join('')}</div><p style="white-space:pre-wrap">${E(x.desc)}</p>${tab=='pending'?`<button class="b" onclick="ap('${x.id}')">✅ મંજૂર</button><button class="b g" onclick="rj('${x.id}')">❌ રિજેક્ટ</button><button class="b g" onclick="bl('${x.uid}','${E(x.phone)}')">🚫 Block user</button>`:`<button class="b" onclick="qk('${x.id}',${!x.quick})">${x.quick?'⚡ Quick Sell માંથી હટાવો':'⚡ Quick Sell માં મૂકો'}</button>`}<button class="b g" onclick="rm('${x.id}')">🗑 Delete</button></div>`).join('')}
const sw=t=>{tab=t;ok=0;render()};
const login=()=>au.signInWithEmailAndPassword($('em').value.trim(),$('pw').value).catch(e=>alert(e.message));
async function load(){try{if(tab=='cats'){const d=await db.collection('meta').doc('cats').get();C=d.exists&&d.data().list?d.data().list:DEF.slice()}else{const s=await db.collection('listings').where('status','==',tab=='pending'?'pending':'approved').limit(300).get();D=s.docs.map(d=>({...d.data(),id:d.id})).filter(x=>tab!='quick'||x.quick).sort((a,b)=>b.ts-a.ts)}}catch(e){alert('Error: '+e.message)}ok=1;render()}
async function sc(){try{await db.collection('meta').doc('cats').set({list:C});render()}catch(e){alert(e.message)}}
function ac(){const v=$('nc').value.trim();if(v&&!C.includes(v)){C.push(v);sc()}}
function ec(i){const v=prompt('કેટેગરીનું નવું નામ:',C[i]);if(v&&v.trim()){C[i]=v.trim();sc()}}
function dc(i){if(confirm('"'+C[i]+'" કેટેગરી હટાવવી છે?')){C.splice(i,1);sc()}}
async function up(id,p){try{await db.collection('listings').doc(id).update(p);if(p.quick!==undefined){D.find(x=>x.id==id).quick=p.quick;if(tab=='quick'&&!p.quick)D=D.filter(x=>x.id!=id)}else D=D.filter(x=>x.id!=id);render()}catch(e){alert(e.message)}}
const ap=id=>up(id,{status:'approved',reason:''}),qk=(id,q)=>up(id,{quick:q});
function rj(id){const r=prompt('રિજેક્ટનું કારણ લખો:');if(r&&r.trim())up(id,{status:'rejected',reason:r.trim()})}
async function bl(uid,ph){if(!confirm('આ user ને block કરવો?'))return;try{await db.collection('blocked').doc(uid).set({phone:ph,ts:Date.now()});alert('Blocked ✅')}catch(e){alert(e.message)}}
async function rm(id){if(!confirm('Delete કરવી છે?'))return;const x=D.find(z=>z.id==id);try{await db.collection('listings').doc(id).delete();[...x.imgs,x.thumb].forEach(u=>st.refFromURL(u).delete().catch(()=>{}));D=D.filter(z=>z.id!=id);render()}catch(e){alert(e.message)}}
render();
</script></body></html>
